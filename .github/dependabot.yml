version: 2
updates:
  # Root npm workspace (CLI + shared devDeps)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      # Batch minor + patch bumps into one PR per week to reduce noise.
      # Majors stay individual PRs so breaking changes get proper review.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      # Batch security patches across all deps into one PR.
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
      include: scope

  # Website workspace (Docusaurus docs site)
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    labels:
      - dependencies
      - docs
    commit-message:
      prefix: chore(deps)
      include: scope

  # GitHub Actions workflow updates
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
      include: scope
